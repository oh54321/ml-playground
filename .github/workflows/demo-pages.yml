name: Publish 2048 demo

on:
  push:
    branches: [rwu/ppo-2048]
    paths:
      - games/rl_2048/demo_web/**
      - games/rl_2048/tests/test_browser_game.mjs
      - .github/workflows/demo-pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: games/rl_2048/demo_web/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: games/rl_2048/demo_web
      - run: npm test && npm run build
        working-directory: games/rl_2048/demo_web
      - uses: actions/upload-pages-artifact@v4
        with:
          path: games/rl_2048/demo_web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
